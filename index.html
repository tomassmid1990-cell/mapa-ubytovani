<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mapa ubytování – Morava a Slezsko</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:system-ui,Arial,sans-serif}#map{position:fixed;inset:0}#controls{position:fixed;z-index:1000;top:10px;left:10px;width:min(355px,calc(100vw - 20px));background:white;border-radius:12px;box-shadow:0 2px 16px #0004;overflow:hidden}#toggle{display:block;width:100%;background:#103e57;color:white;padding:13px;border:0;text-align:left;font-weight:bold;font-size:16px}#summary{padding:9px 12px;font-size:13px;background:#e7f4ef}#panel{display:none;padding:12px;max-height:65dvh;overflow:auto}#controls.open #panel{display:block}label{display:block;font-size:13px;margin:9px 0 4px;font-weight:600}input,select{width:100%;font-size:16px;padding:9px;min-height:40px;border:1px solid #aaa;border-radius:6px}label.check{display:flex;gap:8px;align-items:center}label.check input{width:auto;min-height:0}button.action{padding:9px;width:100%;margin-top:9px;background:#fff;border:1px solid #789;border-radius:6px}#error{position:fixed;bottom:10px;left:10px;right:10px;z-index:2000;display:none;background:#fff1d6;padding:12px;border-radius:8px}.leaflet-popup-content{overflow-wrap:anywhere}
</style></head><body><div id="map"></div><div id="controls"><button id="toggle" aria-expanded="false">☰ Filtry ubytování</button><div id="summary">Načítání aktuální databáze…</div><div id="panel"><label for="region">Kraj</label><select id="region"><option value="">Všechny kraje</option></select><label for="district">Okres</label><select id="district"><option value="">Všechny okresy</option></select><label for="search">Název nebo adresa</label><input id="search" placeholder="Hledat ubytování"><label for="price">Maximální cena Kč/os./noc</label><input id="price" type="number" min="0" placeholder="Bez limitu"><label for="status">Stav ověření</label><select id="status"><option value="">Všechny stavy</option><option value="doloženo">Doloženo online</option><option value="neověřena">Cena neověřena</option><option value="čeká">Čeká na ověření</option></select><label class="check"><input type="checkbox" id="unknown" checked> Zahrnout neznámé ceny</label><label class="check"><input type="checkbox" id="circles"> Zobrazit okruhy 25 km</label><button class="action" id="reset">Vymazat filtry</button><button class="action" id="reload">Načíst nejnovější CSV</button><p style="font-size:12px;color:#53616a">Data se načítají ze souboru <b>ubytovani.csv</b> při každém otevření stránky. Okruhy 25 km představují vzdušnou vzdálenost, nikoliv ověření dostupnosti ubytování. Ceny a provoz je nutné ověřit.</p></div></div><div id="error" role="alert"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='mapa-ubytovani-last-good-csv-v1';let data=[],map,points,circles;if(!window.L){$('summary').textContent='Mapová knihovna není dostupná';return}map=L.map('map',{preferCanvas:true,zoomControl:false}).setView([49.5,16.7],8);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);points=L.layerGroup().addTo(map);circles=L.layerGroup().addTo(map);
function csvRows(s){s=s.replace(/^\uFEFF/,'');const rows=[];let row=[],value='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(value);value=''}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push(row);row=[];value=''}else value+=c}row.push(value);if(row.some(x=>x.trim()))rows.push(row);return rows}
function parse(s){const rows=csvRows(s);if(!rows.length)throw Error('Prázdné CSV');const h=rows.shift().map(x=>x.trim().toLowerCase());const col=(r,...names)=>{for(const n of names){const i=h.indexOf(n);if(i>=0)return (r[i]||'').trim()}return ''};const out=[];for(const r of rows){const lat=Number(col(r,'lat','latitude').replace(',','.')),lon=Number(col(r,'lon','longitude').replace(',','.'));if(!(lat>=48&&lat<=51&&lon>=12&&lon<=19))continue;out.push({id:col(r,'id'),name:col(r,'name','název'),address:col(r,'address','adresa'),kraj:col(r,'kraj'),okres:col(r,'okres'),lat,lon,phone:col(r,'phone','telefon'),price:col(r,'price','cena'),status:col(r,'status','stav'),web:col(r,'web'),source:col(r,'source')})}if(!out.length)throw Error('CSV neobsahuje platné body');return out}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function price(x){const m=String(x||'').replace(/\s/g,'').replace(',','.').match(/\d+(?:\.\d+)?/);return m?Number(m[0]):null}
function options(idvalues,defaultText){const el=$(id),old=el.value;el.innerHTML='';const a=document.createElement('option');a.value='';a.textContent=defaultText;el.append(a);[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'cs')).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)});if([...el.options].some(o=>o.value===old))el.value=old}
function districts(){options('district',data.filter(x=>!$('region').value||x.kraj===$('region').value).map(x=>x.okres),'Všechny okresy')}
function render(){points.clearLayers();circles.clearLayers();let n=0;for(const r of data){const p=price(r.price),max=$('price').value===''?null:Number($('price').value);if($('region').value&&r.kraj!==$('region').value||$('district').value&&r.okres!==$('district').value||$('status').value&&!r.status.toLowerCase().includes($('status').value)||$('search').value&&!(r.name+' '+r.address).toLocaleLowerCase('cs').includes($('search').value.toLocaleLowerCase('cs'))||max!==null&&((p===null&&!$('unknown').checked)||(p!==null&&p>max)))continue;n++;const status=r.status.toLowerCase();const color=status.includes('doloženo')?'#219267':status.includes('čeká')?'#e28a24':'#8795a0';const marker=L.circleMarker([r.lat,r.lon],{radius:6,color:'#fff',weight:1,fillColor:color,fillOpacity:.95});let html='<strong>'+escapeHtml(r.name)+'</strong><br>'+escapeHtml(r.address)+'<br>'+escapeHtml(r.okres)+' · '+escapeHtml(r.kraj)+'<br><b>Cena:</b> '+escapeHtml(r.price||'nezjištěna')+'<br><b>Stav:</b> '+escapeHtml(r.status);if(r.phone)html+='<br><b>Telefon:</b> '+escapeHtml(r.phone);if(/^https?:\/\//i.test(r.web))html+='<br><a target="_blank" rel="noopener noreferrer" href="'+escapeHtml(r.web)+'">Web zařízení</a>';marker.bindPopup(html);points.addLayer(marker);if($('circles').checked)L.circle([r.lat,r.lon],{radius:25000,stroke:false,fillColor:'#228e5d',fillOpacity:.04,interactive:false}).addTo(circles)}$('summary').textContent='Zobrazeno '+n+' / '+data.length+' zařízení'}
function init(){options('region',data.map(x=>x.kraj),'Všechny kraje');districts();render()}
async function load(){try{$('summary').textContent='Načítání aktuální databáze…';const res=await fetch('./ubytovani.csv?updated='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const raw=await res.text(),newData=parse(raw);data=newData;try{localStorage.setItem(key,raw)}catch(_){}$('error').style.display='none';init()}catch(e){const backup=localStorage.getItem(key);if(backup){try{data=parse(backup);init();$('error').textContent='Aktuální CSV se nepodařilo načíst. Zobrazena poslední uložená verze: '+e.message;$('error').style.display='block';return}catch(_){}}$('summary').textContent='Data nejsou dostupná';$('error').textContent='Soubor ubytovani.csv se nepodařilo načíst: '+e.message;$('error').style.display='block'}}
$('toggle').onclick=()=>{const open=$('controls').classList.toggle('open');$('toggle').setAttribute('aria-expanded',String(open));setTimeout(()=>map.invalidateSize(),100)};$('region').onchange=()=>{districts();render()};for(const id of ['district','search','price','status','unknown','circles'])$(id).addEventListener('input',render);$('reset').onclick=()=>{for(const id of ['region','district','search','price','status'])$(id).value='';$('unknown').checked=true;$('circles').checked=false;districts();render()};$('reload').onclick=load;load();})();
</script></body></html>
